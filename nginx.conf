# Cloudflare Tunnel 로 들어오면 실제 접속 IP 는 CF-Connecting-IP, 원래 프로토콜은 X-Forwarded-Proto(https) 에 있다.
# 집 안에서 192.168.0.41 로 직접 들어오면 둘 다 없으므로 nginx 가 본 값을 쓴다.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
map $http_x_forwarded_proto $hsts {
    https   "max-age=31536000";
    default "";
}
map $http_x_forwarded_proto $client_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Cloudflare 를 거쳐 http 로 들어오면 https 로 보낸다 (토큰·세션이 평문으로 오가지 않게).
    # 집 안에서 192.168.0.41 로 직접 오면 X-Forwarded-Proto 가 없어 그대로 둔다
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # 이미지 일괄 업로드 (백엔드 한도 300MB 와 맞춤)
    client_max_body_size 300m;

    location ~ ^/(api|files|actuator/health)(/|$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $client_proto;
        # "AI로 생성" 은 수십 초 걸릴 수 있다
        proxy_read_timeout 300s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTTPS 로 들어온 경우 브라우저가 이후에도 HTTPS 만 쓰게 한다
    add_header Strict-Transport-Security $hsts always;

    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security $hsts always;
        try_files $uri /index.html;
    }
}
